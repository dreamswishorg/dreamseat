<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="DreamEats - Rescue surplus food in Ghana.">
  <meta name="theme-color" content="#0F3D26">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DREAMEATS">
  <link rel="apple-touch-icon" href="logo.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="logo.jpg"/>

  <title>DREAMEATS</title>
  <link rel="manifest" href="manifest.json">
  <!-- Liquid Glass JS Engine -->
  <script src="liquid_glass.js" defer></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: transparent;
    }

    body {
      min-height: 100vh;
    }

    flutter-view {
      background: transparent !important;
    }

    #flutter_canvas {
      width: 100%;
      height: 100%;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      background: linear-gradient(135deg, #14522F, #0F3D26);
      z-index: 9999;
      transition: opacity .3s ease;
    }

    .splash-logo {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(183, 227, 74, .85);
      box-shadow: 0 0 0 10px rgba(255, 255, 255, .05), 0 0 48px rgba(183, 227, 74, .25);
      animation: breathe 2.4s ease-in-out infinite;
    }

    .splash-word {
      color: #fff;
      font: 800 18px/1 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      letter-spacing: 3px;
    }

    .splash-bar {
      width: 120px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .14);
      overflow: hidden;
    }

    .splash-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #B7E34A;
      animation: slide 1.2s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-logo, .splash-bar::after { animation: none; }
    }
  </style>
  <!-- Paystack Web SDK V2 & Interop for flutter_paystack_plus -->
  <script src="https://js.paystack.co/v2/inline.js"></script>
  <script type="text/javascript">
    function paystackPopUp(publicKey, email, amount, ref, plan, currency, onClosed, callback) {
      if (typeof PaystackPop === 'undefined') {
        alert('Paystack SDK failed to load. Please check your internet connection.');
        if (onClosed) onClosed();
        return;
      }
      var options = {
        key: publicKey,
        email: email,
        amount: amount,
        ref: ref,
        reference: ref,
        currency: currency || 'GHS',
        channels: ['card', 'mobile_money'],
        onClose: function () {
          if (onClosed) onClosed();
        },
        onCancel: function () {
          if (onClosed) onClosed();
        },
        callback: function (response) {
          if (callback) callback();
        },
        onSuccess: function (transaction) {
          if (callback) callback();
        }
      };
      if (plan && plan !== '' && plan !== 'null' && plan !== 'undefined') {
        options.plan = plan;
      }
      try {
        if (typeof PaystackPop.prototype !== 'undefined' && typeof PaystackPop.prototype.newTransaction === 'function') {
          var popup = new PaystackPop();
          popup.newTransaction(options);
          return;
        }
      } catch (e) {
        console.warn('Paystack V2 init failed, falling back to setup:', e);
      }
      var handler = PaystackPop.setup(options);
      handler.openIframe();
    }
  </script>
  <script src="passkeys_bundle.js" type="text/javascript"></script>
  <script type="text/javascript">
    if (typeof PasskeyAuthenticator !== 'undefined') {
      window.Passkeys = PasskeyAuthenticator;
    }

    // Remove loading overlay when first frame is rendered
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function() { loading.remove(); }, 300);
      }
    });

    // Fallback: MutationObserver to remove loader when Flutter view elements are injected
    document.addEventListener('DOMContentLoaded', function() {
      var observer = new MutationObserver(function(mutations) {
        if (document.querySelector('flutter-view') || document.querySelector('canvas')) {
          var loading = document.getElementById('loading');
          if (loading) {
            loading.style.opacity = '0';
            setTimeout(function() { loading.remove(); }, 300);
          }
          observer.disconnect();
        }
      });
      if (document.body) {
        observer.observe(document.body, { childList: true, subtree: true });
      }
    });
  </script>
</head>
<body>
  <div id="loading" role="status" aria-label="Loading DreamEats">
    <img class="splash-logo" src="logo.jpg" alt="" width="88" height="88">
    <div class="splash-word">DREAMEATS</div>
    <div class="splash-bar"></div>
  </div>

  <script>
    // Ensure service worker updates immediately on reload
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) { r.update(); }
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=20261010_03" async></script>
</body>
</html>
