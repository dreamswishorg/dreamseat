<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DREAMEATS">
  <link rel="apple-touch-icon" href="logo.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="logo.jpg"/>

  <title>DREAMEATS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
    }

    #flutter_canvas {
      width: 100%;
      height: 100%;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      background-color: white;
      z-index: 9999;
    }

    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #2E7D32;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <!-- Paystack Web SDK V2 & Interop for flutter_paystack_plus -->
  <script src="https://js.paystack.co/v2/inline.js"></script>
  <script type="text/javascript">
    function paystackPopUp(publicKey, email, amount, ref, plan, currency, onClosed, callback) {
      if (typeof PaystackPop === 'undefined') {
        alert('Paystack SDK failed to load. Please check your internet connection.');
        if (onClosed) onClosed();
        return;
      }
      var options = {
        key: publicKey,
        email: email,
        amount: amount,
        ref: ref,
        reference: ref,
        currency: currency || 'GHS',
        channels: ['card'],
        onClose: function () {
          if (onClosed) onClosed();
        },
        onCancel: function () {
          if (onClosed) onClosed();
        },
        callback: function (response) {
          if (callback) callback();
        },
        onSuccess: function (transaction) {
          if (callback) callback();
        }
      };
      if (plan && plan !== '' && plan !== 'null' && plan !== 'undefined') {
        options.plan = plan;
      }
      try {
        if (typeof PaystackPop.prototype !== 'undefined' && typeof PaystackPop.prototype.newTransaction === 'function') {
          var popup = new PaystackPop();
          popup.newTransaction(options);
          return;
        }
      } catch (e) {
        console.warn('Paystack V2 init failed, falling back to setup:', e);
      }
      var handler = PaystackPop.setup(options);
      handler.openIframe();
    }
  </script>
  <script src="passkeys_bundle.js" type="text/javascript"></script>
  <script type="text/javascript">
    if (typeof PasskeyAuthenticator !== 'undefined') {
      window.Passkeys = PasskeyAuthenticator;
    }

    // Remove loading overlay when first frame is rendered
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function() { loading.remove(); }, 300);
      }
    });

    // Fallback: MutationObserver to remove loader when Flutter view elements are injected
    document.addEventListener('DOMContentLoaded', function() {
      var observer = new MutationObserver(function(mutations) {
        if (document.querySelector('flutter-view') || document.querySelector('canvas')) {
          var loading = document.getElementById('loading');
          if (loading) {
            loading.style.opacity = '0';
            setTimeout(function() { loading.remove(); }, 300);
          }
          observer.disconnect();
        }
      });
      if (document.body) {
        observer.observe(document.body, { childList: true, subtree: true });
      }
    });
  </script>
</head>
<body>
  <div id="loading">
    <div class="loader"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
