server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers (OWASP Recommended) ────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy compatible with Flutter Web / CanvasKit / Paystack
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval' wasm-unsafe-eval; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.paystack.co https://*.tile.openstreetmap.org; frame-src 'self' https://checkout.paystack.com https://standard.paystack.co; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com data:;" always;

    # Force HTTPS when terminated behind proxy (Fly.io, Cloudflare, etc.)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # NEVER cache index.html, flutter_bootstrap.js, service worker, or manifest
    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location = /privacy.html {
        try_files /privacy.html =404;
    }

    location = /terms.html {
        try_files /terms.html =404;
    }

    # Static assets: images, fonts, icons (can be cached safely)
    location ~* \.(?:ico|gif|jpe?g|png|woff2?|eot|otf|ttf|svg)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Scripts, styles, and wasm: revalidate
    location ~* \.(?:js|wasm|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }
}
